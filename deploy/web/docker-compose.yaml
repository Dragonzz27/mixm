name: mixm

x-backend-env: &backend-env
  DATABASE_URL: ${DEPLOY_DATABASE_URL:-postgres://${POSTGRES_USER:-mixm}:${POSTGRES_PASSWORD:-mixm}@postgres:5432/${POSTGRES_DB:-mixm}?sslmode=disable}
  SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-before-deployment}
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-180}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  REDIS_URL: ${DEPLOY_REDIS_URL:-redis://redis:6379/2}
  RABBITMQ_URL: ${DEPLOY_RABBITMQ_URL:-amqp://${RABBITMQ_USER:-mixm}:${RABBITMQ_PASSWORD:-mixm}@rabbitmq:5672/}
  RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-instance_create}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  K8S_CONFIG_PATH: /app/kubeconfig/k3s.yaml
  K8S_SSH_GATEWAY_HOST: ${K8S_SSH_GATEWAY_HOST:-localhost}
  K8S_CODE_SERVER_HOST: ${K8S_CODE_SERVER_HOST:-localhost}
  K8S_SSH_PORT: 30022
  SSH_HOST_KEY_PATH: /app/data/ssh_host_key
  STORAGE_CLASS_NAME: ${STORAGE_CLASS_NAME:-longhorn}
  PVC_ACCESS_MODE: ${PVC_ACCESS_MODE:-ReadWriteMany}
  USER_PERSONAL_PVC_CAPACITY: ${USER_PERSONAL_PVC_CAPACITY:-10Gi}
  REGISTRY_URL: ${DEPLOY_REGISTRY_URL:-http://registry:5000}
  REGISTRY_PREFIX: ${REGISTRY_PREFIX:-localhost:55000}
  REGISTRY_USERNAME: ${REGISTRY_USERNAME:-}
  REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:-}
  RUSTFS_ENDPOINT: ${DEPLOY_RUSTFS_ENDPOINT:-http://rustfs:9000}
  RUSTFS_BUCKET: ${RUSTFS_BUCKET:-content}
  RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
  RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
  LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o}

services:
  backend:
    build:
      context: ../../backend
      dockerfile: ../deploy/web/Dockerfile.backend
    restart: unless-stopped
    ports: ["8002:8002", "30022:30022"]
    volumes:
      - ../../backend/kubeconfig:/app/kubeconfig:ro
      - backend_uploads:/app/uploads
      - backend_static:/app/static
      - backend_data:/app/data
    environment: *backend-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [default, middleware]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ../../backend
      dockerfile: ../deploy/web/Dockerfile.backend
    restart: unless-stopped
    command: ["worker"]
    volumes: ["../../backend/kubeconfig:/app/kubeconfig:ro"]
    environment: *backend-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [default, middleware]

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deploy/web/Dockerfile.frontend
    restart: unless-stopped
    ports: ["5173:5173"]
    volumes:
      - ../../frontend/src:/app/src
      - ../../frontend/public:/app/public
      - ../../frontend/index.html:/app/index.html
      - ../../frontend/vite.config.js:/app/vite.config.js
    command: pnpm dev --host 0.0.0.0 --port 5173
    environment:
      VITE_API_BASE_URL: /api
    depends_on:
      backend: {condition: service_healthy}

volumes:
  backend_uploads:
    name: ${BACKEND_UPLOADS_VOLUME_NAME:-mixm_backend_uploads}
  backend_static:
    name: ${BACKEND_STATIC_VOLUME_NAME:-mixm_backend_static}
  backend_data:
    name: ${BACKEND_DATA_VOLUME_NAME:-mixm_backend_data}

networks:
  default:
  middleware:
    name: mixm-services
    external: true
