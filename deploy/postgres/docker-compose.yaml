name: postgres

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mutim
      POSTGRES_USER: mutim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mutim}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mutim -d mutim"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
    name: mixm-edu_postgres_data

networks:
  default:
    name: mixm-services
    external: true
