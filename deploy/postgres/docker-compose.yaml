name: postgres

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mixm}
      POSTGRES_USER: ${POSTGRES_USER:-mixm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mixm}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-mixm_postgres_data}

networks:
  default:
    name: mixm-services
    external: true
