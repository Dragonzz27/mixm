name: rabbitmq

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: ${RABBITMQ_HOSTNAME:-rabbitmq}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: mutim
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mutim}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  rabbitmq_data:
    name: mixm-edu_rabbitmq_data

networks:
  default:
    name: mixm-services
    external: true
