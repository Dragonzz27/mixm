services:
  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:8.4.0-alpine
    container_name: redis_cache
    restart: unless-stopped
    command: redis-server
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rustfs:
    image: registry.cn-hangzhou.aliyuncs.com/yoobit_docker/rustfs:v1
    container_name: rustfs-server
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - ./RustFS/data:/data
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_CONSOLE_ENABLE=true
    command:
      - --console-enable
      - /data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_app
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
      - ./backend/static:/app/static
      - ./backend/uploads:/app/uploads
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    environment:
      - DATABASE_URL=sqlite:///./app.db
      - SECRET_KEY=your-secret-key-here
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=180
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - QUEUE_REDIS_URL=redis://redis:6379/2
      - RUSTFS_ENDPOINT=http://rustfs:9000
      - KT_MODEL_BACKEND=kt_service
      - KT_SERVICE_URL=http://kt-service:8010
      - KT_SERVICE_TIMEOUT_SECONDS=3

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: celery_worker
    restart: unless-stopped
    volumes:
      - ./backend:/app
    working_dir: /app
    command: python run_celery.py
    environment:
      - CELERY_WORKER_CONCURRENCY=4
      - CELERY_WORKER_POOL=solo
      - CELERY_WORKER_LOGLEVEL=info
      - CELERY_WORKER_QUEUE=instance_create
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - DATABASE_URL=sqlite:///./app.db
      - SECRET_KEY=your-secret-key-here
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=180
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - QUEUE_REDIS_URL=redis://redis:6379/2

  kt-service:
    build:
      context: ./kt_service
      dockerfile: Dockerfile
    container_name: kt_service
    restart: unless-stopped
    ports:
      - "8010:8010"
    volumes:
      - ./kt_service/train/output:/app/train/output
    environment:
      - KT_DKT_CHECKPOINT=/app/train/output/dkt_checkpoint.pt
      - KT_DKT_SKILL_MAP=/app/train/output/skill_map.json

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_app
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/.env:/app/.env
    working_dir: /app
    command: pnpm dev --host 0.0.0.0 --port 5173
    environment:
      - VITE_API_BASE_URL=http://localhost:8002/api
